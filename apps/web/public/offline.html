<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — ERP</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f172a; color: #e2e8f0; text-align: center; padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; color: #38bdf8; }
      p { margin: 6px 0; line-height: 1.5; color: #94a3b8; }
      .ar { direction: rtl; }
      button {
        margin-top: 18px; padding: 10px 20px; border: 0; border-radius: 8px;
        background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page hasn't been cached yet. Reconnect to load it, then it will be available offline.</p>
      <p class="ar">أنت غير متصل بالإنترنت. لم يتم تخزين هذه الصفحة بعد — أعد الاتصال لتحميلها.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
