# GVS ERP — Local Edition gateway.
#
# Single entry point on the PC (http://localhost:${GVS_PORT}). Everything the
# browser needs is served from ONE origin, so there is no CORS and the web app
# can use window.location.origin as both its Supabase URL and API URL.
#
#   /auth/v1/*     -> GoTrue   (login, sessions, admin user API)
#   /rest/v1/*     -> PostgREST (data API used by supabase-js in the API)
#   /storage/v1/*  -> Storage  (logos, invoice PDFs, item images)
#   /api/v1/*      -> Express API
#   /health        -> gateway liveness
#   /*             -> Next.js web app
#
# JWTs are verified by each upstream service itself (GoTrue, PostgREST and
# Storage all check the signature with JWT_SECRET), so the gateway does not
# need Kong's key-auth. The port is bound to 127.0.0.1 only.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS: resolve service names at request time so the
  # gateway starts even if an upstream (e.g. web) is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 50m;
  proxy_read_timeout 300s;
  proxy_http_version 1.1;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location /auth/v1/ {
      set $auth http://auth:9999;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $auth;
    }

    location /rest/v1/ {
      set $rest http://rest:3000;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $rest;
    }

    location /storage/v1/ {
      set $storage http://storage:5000;
      proxy_set_header X-Forwarded-Prefix /storage/v1;
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_pass $storage;
    }

    location /api/v1/ {
      set $api http://api:3001;
      proxy_pass $api;
    }

    location / {
      set $web http://web:3000;
      proxy_pass $web;
    }
  }
}
