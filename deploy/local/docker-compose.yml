# GVS ERP — Local Edition (single PC, on-premise).
#
# A trimmed self-hosted Supabase stack (Postgres, GoTrue, PostgREST, Storage)
# plus the GVS API, a migration runner and an nginx gateway.
# Only the gateway is published, and only on 127.0.0.1 (not reachable from LAN).
#
# This file uses prebuilt images only (no source code needed on the client PC).
# Developers build the GVS images from source with the override file:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# First time:   node scripts/generate-env.mjs
# Start:        docker compose up -d
# Open:         http://localhost:8080
#
# Supabase service versions are pinned to the upstream self-hosting stack
# (github.com/supabase/supabase/tree/master/docker). Upgrade only via a tested release.

name: gvs-erp

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/generate-env.mjs first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      # Sets passwords for the Supabase service roles (must run as superuser).
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${GVS_PORT:-8080}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${GVS_PORT:-8080}
      GOTRUE_URI_ALLOW_LIST: ""
      # Users are created by the GVS API (admin API), never by public sign-up.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: http://localhost:${GVS_PORT:-8080}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # No email server on a local PC: accounts are confirmed immediately.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@localhost
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: supabase/storage-api:v1.89.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://localhost:${GVS_PORT:-8080}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: applies pending app migrations, then exits.
  # Runs after GoTrue and Storage have created the auth.* / storage.* tables
  # that our migrations reference (auth.users, storage.buckets).
  migrate:
    image: ${GVS_REGISTRY:-ghcr.io/hossamsharif}/gvs-migrate:${GVS_VERSION:-dev}
    restart: "no"
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres

  api:
    image: ${GVS_REGISTRY:-ghcr.io/hossamsharif}/gvs-api:${GVS_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DEPLOYMENT_MODE: local
      # PC identity for PC-locked license keys (shown as the PC ID on the License page).
      GVS_MACHINE_ID: ${GVS_MACHINE_ID:-}
      # Internal URL: the API reaches Supabase through the gateway on the Docker network.
      SUPABASE_URL: http://gateway:8080
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Origin the BROWSER uses for Supabase. Public file URLs (logos,
      # signed PDF links) are rewritten from SUPABASE_URL to this.
      SUPABASE_PUBLIC_URL: http://localhost:${GVS_PORT:-8080}
      CORS_ORIGIN: http://localhost:${GVS_PORT:-8080}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${GVS_REGISTRY:-ghcr.io/hossamsharif}/gvs-web:${GVS_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DEPLOYMENT_MODE: local
      # Read at request time and injected into the page (runtime-config.ts).
      SUPABASE_ANON_KEY: ${ANON_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/ar/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
      - api
      - web
    ports:
      - "127.0.0.1:${GVS_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Daily full backup (database + uploaded files) into ./backups on the PC's
  # disk (C:\GvsERP\backups on Windows). See backup/backup.sh.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/gvs/backup.sh"]
    command: ["daemon"]
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      STORAGE_DIR: /storage
      KEEP_DAILY: ${GVS_KEEP_DAILY_BACKUPS:-30}
    volumes:
      - ./backup/backup.sh:/opt/gvs/backup.sh:ro
      - ${GVS_BACKUP_DIR:-./backups}:/backups
      - storage-data:/storage

volumes:
  db-data:
  db-config:
  storage-data:
