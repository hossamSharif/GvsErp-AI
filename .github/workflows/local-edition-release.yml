# Local Edition release: builds the GVS images, starts them with the client's
# compose file as a smoke test, and packages the Windows installer.
#
# Release:  push a tag like  local-v1.0.0
#           -> images pushed to GHCR, GitHub Release with GvsERP-Local-1.0.0.zip
# Pilot:    push a tag like  local-pilot-v0.9.0  (works from any branch)
#           -> TEST license key allowed, version "0.9.0-testkey",
#              GitHub *pre-release* with the zip, images not pushed
# Manual:   Actions tab -> "Local Edition release" -> Run workflow
#           (only once this file is on the default branch)
#           -> zip uploaded as a workflow artifact (optionally images pushed)
#
# Release builds refuse to run while the license TEST key is embedded
# (apps/api/src/lib/license/public-key.ts, IS_TEST_KEY = true). Manual runs
# can allow it for pilots; those versions get a "-testkey" suffix.
#
# Nothing here deploys the cloud app (Vercel / Fly.io).

name: Local Edition release

on:
  push:
    tags: ['local-v*', 'local-pilot-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.9.0-pilot1)'
        required: true
        default: '0.0.0-dev'
      allow_test_key:
        description: 'Allow the license TEST key (pilot/testing only, never for paying clients)'
        type: boolean
        default: false
      push_images:
        description: 'Also push the images to GHCR'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: local-edition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and registry
        id: meta
        shell: bash
        run: |
          prerelease=false
          if [[ "${GITHUB_REF}" == refs/tags/local-v* ]]; then
            version="${GITHUB_REF#refs/tags/local-v}"
            release=true
            allow_test_key=false
            push_images=true
          elif [[ "${GITHUB_REF}" == refs/tags/local-pilot-v* ]]; then
            version="${GITHUB_REF#refs/tags/local-pilot-v}"
            release=true
            prerelease=true
            allow_test_key=true
            push_images=false
          else
            version="${{ inputs.version }}"
            release=false
            allow_test_key="${{ inputs.allow_test_key }}"
            push_images="${{ inputs.push_images }}"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid version '$version'"; exit 1
          fi
          if grep -qE 'IS_TEST_KEY\s*=\s*true' apps/api/src/lib/license/public-key.ts; then
            if [[ "$allow_test_key" != "true" ]]; then
              echo "::error::The license TEST key is still embedded. Create your own key (scripts/license/README.md), set IS_TEST_KEY = false, then release."
              exit 1
            fi
            version="${version}-testkey"
            echo "::warning::Building with the license TEST key: anyone can create license keys for this build."
          fi
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=$version"
            echo "release=$release"
            echo "prerelease=$prerelease"
            echo "push_images=$push_images"
            echo "registry=$registry"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, registry $registry, release=$release, push=$push_images"

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Unit tests (API, offline engine)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @erp/shared --filter @erp/database --filter @erp/offline-engine build
          pnpm --filter @erp/api test
          pnpm --filter @erp/offline-engine test

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        env:
          REG: ${{ steps.meta.outputs.registry }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          docker build -f Dockerfile -t "$REG/gvs-api:$VER" .
          docker build -f deploy/local/web/Dockerfile -t "$REG/gvs-web:$VER" .
          docker build -f deploy/local/migrate/Dockerfile -t "$REG/gvs-migrate:$VER" .

      - name: Smoke test with the client compose file
        working-directory: deploy/local
        env:
          REG: ${{ steps.meta.outputs.registry }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/generate-env.mjs
          sed -i "s#^GVS_VERSION=.*#GVS_VERSION=$VER#" .env
          echo "GVS_REGISTRY=$REG" >> .env
          docker compose pull --ignore-pull-failures --quiet db auth rest storage gateway backup
          docker compose up -d --wait --pull never
          curl -fsS http://localhost:8080/api/health
          test "$(curl -fsS http://localhost:8080/api/v1/auth/setup-status)" = '{"data":{"mode":"local","needsSetup":true}}'
          curl -fsS http://localhost:8080/en/login | grep -q '__GVS_CONFIG__'
          docker compose exec -T backup /bin/sh /opt/gvs/backup.sh now ci
          ls -la backups
          docker compose ps --all

      - name: Smoke test logs
        if: failure()
        working-directory: deploy/local
        run: docker compose logs --no-color --tail 300

      - name: Push images to GHCR
        if: steps.meta.outputs.push_images == 'true'
        env:
          REG: ${{ steps.meta.outputs.registry }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in gvs-api gvs-web gvs-migrate; do docker push "$REG/$img:$VER"; done

      - name: Package the Windows installer
        id: package
        env:
          REG: ${{ steps.meta.outputs.registry }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          pkg="GvsERP-Local-$VER"
          app="dist/$pkg/app"
          mkdir -p "$app/scripts" "$app/windows" "dist/$pkg/images"
          cp deploy/local/docker-compose.yml deploy/local/GvsERP.bat "$app/"
          cp -r deploy/local/backup deploy/local/db deploy/local/gateway "$app/"
          cp deploy/local/scripts/generate-env.mjs deploy/local/scripts/reset-password.mjs "$app/scripts/"
          cp deploy/local/windows/*.ps1 deploy/local/windows/gvs-erp.ico "$app/windows/"
          cp deploy/local/windows/Install.bat deploy/local/windows/README.txt "dist/$pkg/"
          echo "$VER" > "$app/VERSION"
          # The installer's default registry must match where these images live.
          if [ "$REG" != "ghcr.io/hossamsharif" ]; then
            sed -i "s#ghcr.io/hossamsharif#$REG#g" "$app/docker-compose.yml" "$app/windows/install.ps1"
          fi
          docker save -o "dist/$pkg/images/gvs-images-$VER.tar" "$REG/gvs-api:$VER" "$REG/gvs-web:$VER" "$REG/gvs-migrate:$VER"
          (cd dist && zip -qr "$pkg.zip" "$pkg")
          ls -la dist
          echo "zip=dist/$pkg.zip" >> "$GITHUB_OUTPUT"
          echo "name=$pkg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          retention-days: 30

      - name: Create GitHub Release
        if: steps.meta.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          extra=()
          if [ "$PRERELEASE" = "true" ]; then extra=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${{ steps.package.outputs.zip }}" "${extra[@]}" \
            --title "GVS ERP Local Edition $VER" \
            --notes "Windows installer for the Local Edition. Unzip, then double-click Install.bat. To update an existing PC, run Install.bat from this package."
