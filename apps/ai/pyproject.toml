[project]
name = "erp-ai-companion"
version = "0.1.0"
description = "Generative AI companion app for ErpSystem2025 — chat, tools, RAG, MCP, pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.60",
    "streamlit>=1.40",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "supabase>=2.10",
    "jinja2>=3.1",
    "weasyprint>=63",
    "chromadb>=1.5.8",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.2",
    "langchain-chroma>=1.1.0",
    "apscheduler>=3.10",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
