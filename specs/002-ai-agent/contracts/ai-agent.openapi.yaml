openapi: 3.1.0
info:
  title: AI Agent Assistant API
  description: |
    API endpoints for the AI Agent Assistant feature in the ERP system.
    Provides conversational AI capabilities, document processing, task automation,
    and usage tracking with subscription tier enforcement.
  version: 1.0.0
  contact:
    name: ERP SaaS API Team

servers:
  - url: http://localhost:3001/api
    description: Local development server
  - url: https://api.erp-saas.example.com/api
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: Conversations
    description: AI conversation management
  - name: Messages
    description: Message exchange within conversations
  - name: Documents
    description: Document upload and processing
  - name: Tasks
    description: AI-generated task approval and execution
  - name: Usage
    description: Usage tracking and tier limits
  - name: Admin
    description: SaaS admin dashboard and controls

paths:
  /ai/conversations:
    get:
      tags: [Conversations]
      summary: List user's conversations
      description: Retrieves all conversations for the authenticated user, sorted by last update
      operationId: listConversations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
          description: Filter by conversation status
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Conversations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Conversations]
      summary: Create a new conversation
      description: Starts a new AI conversation with optional initial message
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                  description: Optional custom title
                consultant_role:
                  $ref: '#/components/schemas/ConsultantRole'
                initial_message:
                  type: string
                  maxLength: 10000
                  description: Optional first user message
              example:
                consultant_role: general
                initial_message: "What were my total sales last month?"
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationWithMessages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /ai/conversations/{conversationId}:
    get:
      tags: [Conversations]
      summary: Get conversation details
      description: Retrieves a specific conversation with all messages
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationWithMessages'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Conversations]
      summary: Update conversation
      description: Updates conversation title, role, or status
      operationId: updateConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                consultant_role:
                  $ref: '#/components/schemas/ConsultantRole'
                status:
                  type: string
                  enum: [active, archived]
              example:
                consultant_role: financial_analyst
      responses:
        '200':
          description: Conversation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Conversations]
      summary: Delete conversation
      description: Soft-deletes a conversation (sets deleted_at timestamp)
      operationId: deleteConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204':
          description: Conversation deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /ai/conversations/{conversationId}/messages:
    post:
      tags: [Messages]
      summary: Send a message
      description: |
        Sends a user message to the AI and streams the response.
        Uses Server-Sent Events (SSE) for streaming.
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: stream
          in: query
          schema:
            type: boolean
            default: true
          description: Enable streaming response (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 10000
                  description: User's message text
                document_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Attached document IDs (previously uploaded)
              example:
                content: "Create an invoice for Customer ABC with 5 units of Item X"
                document_ids: []
      responses:
        '200':
          description: Message sent, response streaming (if stream=true)
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream with AI response chunks
            application/json:
              schema:
                type: object
                description: Non-streaming response (if stream=false)
                properties:
                  user_message:
                    $ref: '#/components/schemas/Message'
                  assistant_message:
                    $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Usage limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Daily question limit reached (25/25). Upgrade to Premium for unlimited questions."
                code: "USAGE_LIMIT_EXCEEDED"
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI service unavailable (request queued for retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "AI service temporarily unavailable. Your request has been queued and will be retried automatically."
                code: "AI_SERVICE_UNAVAILABLE"
                retry_after: 300

  /ai/documents:
    post:
      tags: [Documents]
      summary: Upload a document
      description: |
        Uploads a document (image or PDF) for AI processing.
        File is stored in Supabase Storage and queued for extraction.
      operationId: uploadDocument
      parameters:
        - name: conversation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation to attach document to
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, PNG, JPG)
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid file type or size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "File size exceeds 10MB limit"
                code: "FILE_TOO_LARGE"
        '403':
          description: Document upload limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Monthly document limit reached (3/3 for free tier)"
                code: "DOCUMENT_LIMIT_EXCEEDED"

  /ai/documents/{documentId}:
    get:
      tags: [Documents]
      summary: Get document details
      description: Retrieves document metadata and extraction status
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

  /ai/tasks:
    get:
      tags: [Tasks]
      summary: List user's AI tasks
      description: Retrieves AI-generated tasks awaiting approval
      operationId: listTasks
      parameters:
        - name: approval_status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, executed]
          description: Filter by approval status
        - name: conversation_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by conversation
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer

  /ai/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task details
      description: Retrieves a specific AI-generated task
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Tasks]
      summary: Update task status
      description: Approve, reject, or execute an AI-generated task
      operationId: updateTaskStatus
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_status]
              properties:
                approval_status:
                  type: string
                  enum: [approved, rejected, executed]
                modified_data:
                  type: object
                  description: User modifications to generated data (optional)
              example:
                approval_status: approved
      responses:
        '200':
          description: Task status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Cannot transition from 'executed' to 'approved'"
                code: "INVALID_STATUS_TRANSITION"

  /ai/usage:
    get:
      tags: [Usage]
      summary: Get usage statistics
      description: Retrieves current user's AI usage stats and remaining allowances
      operationId: getUsageStats
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, month]
            default: today
      responses:
        '200':
          description: Usage stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStats'

  /ai/admin/usage:
    get:
      tags: [Admin]
      summary: Get aggregate usage across all tenants
      description: SaaS admin endpoint for monitoring system-wide AI usage
      operationId: getAdminUsageStats
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by specific tenant
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Admin usage stats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_queries:
                    type: integer
                  total_documents:
                    type: integer
                  total_tasks:
                    type: integer
                  total_tokens:
                    type: integer
                  total_cost_estimate:
                    type: number
                    format: decimal
                  by_tenant:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant_id:
                          type: string
                          format: uuid
                        queries:
                          type: integer
                        cost_estimate:
                          type: number
        '403':
          $ref: '#/components/responses/Forbidden'

  /ai/admin/configurations:
    get:
      tags: [Admin]
      summary: Get system-wide AI configurations
      description: SaaS admin endpoint for viewing global AI settings
      operationId: getAdminConfigurations
      responses:
        '200':
          description: Configurations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Configuration'

    post:
      tags: [Admin]
      summary: Create or update system configuration
      description: SaaS admin endpoint for managing global AI settings
      operationId: upsertAdminConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_key, config_value]
              properties:
                config_key:
                  type: string
                  pattern: '^[a-z_]+$'
                config_value:
                  type: object
              example:
                config_key: "rate_limits"
                config_value:
                  questions_per_minute: 10
                  questions_per_day_free: 25
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ai/admin/tenants/{tenantId}/disable:
    post:
      tags: [Admin]
      summary: Disable AI for a tenant
      description: SaaS admin endpoint to disable AI features for a specific tenant
      operationId: disableTenantAI
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: AI disabled for tenant successfully
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token from authentication

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Conversation UUID

    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Document UUID

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Task UUID

  schemas:
    ConsultantRole:
      type: string
      enum:
        - general
        - marketing
        - legal
        - customer_service
        - financial_analyst
      description: AI consultant persona/mode

    Conversation:
      type: object
      required: [id, tenant_id, user_id, title, consultant_role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        consultant_role:
          $ref: '#/components/schemas/ConsultantRole'
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        message_count:
          type: integer
          description: Total number of messages (computed)

    ConversationWithMessages:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    Message:
      type: object
      required: [id, conversation_id, role, content, token_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        document_ids:
          type: array
          items:
            type: string
            format: uuid
        token_count:
          type: integer
        model_used:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Document:
      type: object
      required: [id, conversation_id, tenant_id, user_id, file_name, file_type, file_size, processing_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_type:
          type: string
          enum: [application/pdf, image/png, image/jpeg, image/jpg]
        file_size:
          type: integer
          description: Size in bytes
        storage_url:
          type: string
          format: uri
          description: Signed URL for download (temporary)
        extracted_text:
          type: string
          nullable: true
        processing_status:
          type: string
          enum: [pending, processing, completed, failed]
        processing_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Task:
      type: object
      required: [id, conversation_id, message_id, tenant_id, user_id, task_type, generated_data, approval_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        task_type:
          type: string
          enum: [invoice, purchase_order, sales_order, payment, journal_entry]
        generated_data:
          type: object
          description: Schema varies by task_type
        approval_status:
          type: string
          enum: [pending, approved, rejected, executed]
        executed_at:
          type: string
          format: date-time
          nullable: true
        result_id:
          type: string
          format: uuid
          nullable: true
          description: ID of created transaction (if executed)
        created_at:
          type: string
          format: date-time

    UsageStats:
      type: object
      required: [period, questions, documents, tasks, limits]
      properties:
        period:
          type: string
          enum: [today, month]
        questions:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
            remaining:
              type: integer
        documents:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
            remaining:
              type: integer
        tasks:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
            remaining:
              type: integer
        subscription_tier:
          type: string
          enum: [free, premium]
        upgrade_prompt:
          type: boolean
          description: Whether to show upgrade prompt (approaching limits)

    Configuration:
      type: object
      required: [id, config_key, config_value, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: NULL for system-wide configs
        config_key:
          type: string
        config_value:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
        details:
          type: object
          nullable: true
          description: Additional error context

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Validation failed"
            code: "VALIDATION_ERROR"
            details:
              content: "Message content is required"

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Authentication required"
            code: "UNAUTHORIZED"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Admin permission required"
            code: "FORBIDDEN"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Conversation not found"
            code: "NOT_FOUND"

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Too many requests. Please try again in 60 seconds."
            code: "RATE_LIMIT_EXCEEDED"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
